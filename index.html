<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-in Mangewumangatus 2026 - Surabaya</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }
    .container { max-width: 520px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { margin: 0 0 6px; font-size: 1.25rem; }
    p.sub { margin: 0 0 18px; color: #94a3b8; font-size: .9rem; }
    .session-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #0f172a; border: 1px solid #0284c7; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; font-size: .85rem; }
    .session-info strong { color: #38bdf8; }
    .btn-logout { width: auto; padding: 6px 10px; font-size: .78rem; background: #334155; color: #f8fafc; border-radius: 6px; flex-shrink: 0; }
    .btn-logout:hover { background: #475569; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: .88rem; color: #e2e8f0; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    input:focus { outline: none; border-color: #38bdf8; }
    .bib-hint { display: block; margin-top: 6px; color: #94a3b8; font-size: .78rem; line-height: 1.45; }
    .hidden { display: none !important; }
    button { width: 100%; padding: 11px 14px; border: none; border-radius: 8px; font-weight: 600; font-size: .95rem; cursor: pointer; transition: .15s; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #0369a1; }
    button:disabled, button.disabled { opacity: .45; cursor: not-allowed; }
    .grid-points { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
    .btn-point { background: #334155; color: #f8fafc; }
    .btn-point:hover:not(:disabled) { background: #475569; }
    .btn-start { background: #16a34a; color: #fff; }
    .btn-start:hover:not(:disabled) { background: #15803d; }
    .btn-finish { background: #2563eb; color: #fff; }
    .btn-finish:hover:not(:disabled) { background: #1d4ed8; }
    .btn-dnf { grid-column: span 2; background: #be123c; color: #fff; }
    .btn-dnf:hover:not(:disabled) { background: #9f1239; }
    .gpx-box { margin-top: 16px; padding-top: 14px; border-top: 1px solid #334155; }
    .gpx-title { font-size: .85rem; color: #94a3b8; margin-bottom: 8px; }
    .gpx-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn-gpx { display: block; text-align: center; text-decoration: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: .88rem; background: #0f172a; color: #38bdf8; border: 1px solid #0284c7; transition: .15s; }
    .btn-gpx:hover:not(.locked) { background: #0284c7; color: #fff; }
    .btn-gpx.locked { opacity: .45; cursor: not-allowed; pointer-events: none; border-color: #475569; color: #94a3b8; }
    #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: .9rem; line-height: 1.45; white-space: pre-line; display: none; }
    .status-ok { display: block !important; background: #052e16; border: 1px solid #16a34a; color: #86efac; }
    .status-warn { display: block !important; background: #422006; border: 1px solid #eab308; color: #fde047; }
    .status-err { display: block !important; background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; }
    .status-info { display: block !important; background: #0c4a6e; border: 1px solid #38bdf8; color: #bae6fd; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Check-in Mangewumangatus 2026</h1>
    <p class="sub">Klaim BIB, pemulihan sesi, dan pelaporan titik check-in / DNF</p>

    <!-- Banner Sesi Tersimpan -->
    <div id="sessionBar" class="session-bar hidden">
      <div class="session-info">
        Sesi Aktif: <strong id="sessionBibText">-</strong>
        <span id="sessionCatText" style="color:#94a3b8;"></span>
      </div>
      <button type="button" class="btn-logout" onclick="clearSavedSession()">Ganti BIB</button>
    </div>

    <form id="registerForm" onsubmit="handleRegisterCheckin(event)">
      <div class="form-group">
        <label for="inputRegId">ID Pendaftar</label>
        <input id="inputRegId" type="text" placeholder="Contoh: Mm2026sby-0003" oninput="onRegIdInput()" required />
      </div>

      <div class="form-group">
        <label for="inputBIB">Nomor BIB</label>
        <input id="inputBIB" type="text" placeholder="Contoh: A01 (5KM), B01 (50KM), 555 (500KM)" oninput="updatePointButtonsByCategory()" required />
        <small class="bib-hint">
          Kategori BIB: <strong>5KM</strong> = <code>A01–A99</code> &bull; <strong>50KM</strong> = <code>B01–B99</code> &bull; <strong>500KM</strong> = <code>500–599</code>
        </small>
      </div>

      <div id="groupBibPair" class="form-group hidden">
        <label for="inputBIB2">Nomor BIB Pasangan / Kedua (Pairing)</label>
        <input id="inputBIB2" type="text" placeholder="Masukkan BIB kedua bila kategori pairing" />
      </div>

      <div id="groupVerifyDob" class="form-group hidden">
        <label for="inputDob">Tanggal Lahir (Verifikasi Pemulihan Sesi)</label>
        <input id="inputDob" type="date" />
      </div>

      <button id="btnSubmitReg" type="submit" class="btn-primary">Hubungkan / Pulihkan BIB</button>
    </form>

    <div class="grid-points">
      <button id="btnStart" type="button" class="btn-point btn-start" onclick="triggerCheckin('start')">START</button>
      <button id="btnCp1" type="button" class="btn-point" onclick="triggerCheckin('cp1')">CP 1</button>
      <button id="btnCp2" type="button" class="btn-point" onclick="triggerCheckin('cp2')">CP 2</button>
      <button id="btnCp3" type="button" class="btn-point" onclick="triggerCheckin('cp3')">CP 3</button>
      <button id="btnFinish" type="button" class="btn-point btn-finish" onclick="triggerCheckin('finish')">FINISH</button>
      <button id="btnDnf" type="button" class="btn-point btn-dnf" onclick="triggerCheckin('dnf')">LAPOR DNF</button>
    </div>

    <div class="gpx-box">
      <div id="gpxTitle" class="gpx-title">Unduh Rute GPX (Terkunci s/d 25 Des 2026 20:59 WIB)</div>
      <div class="gpx-grid">
        <a id="btnGpx5KM" class="btn-gpx locked" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true" onclick="return handleGpxClick(event, '5KM')">Download GPX 5KM</a>
        <a id="btnGpx50KM" class="btn-gpx locked" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true" onclick="return handleGpxClick(event, '50KM')">Download GPX 50KM</a>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5C61hba_pqy48NJCEdqnkY3l1rLJxVTeD4IrdU1bWX1z7m7XWJnY_0nW1bt2sF25z/exec";
    const STORAGE_KEY = "mm2026_sby_checkin_session";

       // --- GPX (SERVER-SIDE) & START LOCK ---
    let serverGpxState = {
      unlocked: false,
      gpx5km: "",
      gpx50km: "",
      message: "Unduhan GPX masih dikunci hingga jadwal pembukaan resmi."
    };

    function updateGpxButtonState() {
      const locked = !serverGpxState.unlocked;
      const link5 = document.getElementById("btnGpx5KM");
      const link50 = document.getElementById("btnGpx50KM");
      const titleEl = document.getElementById("gpxTitle");

      if (titleEl) {
        titleEl.textContent = locked
          ? "Unduh Rute GPX (Terkunci oleh Server)"
          : "Unduh Rute GPX";
      }

      [
        { el: link5, url: serverGpxState.gpx5km },
        { el: link50, url: serverGpxState.gpx50km }
      ].forEach(({ el, url }) => {
        if (!el) return;
        const isDisabled = locked || !url;
        el.classList.toggle("locked", isDisabled);
        el.setAttribute("aria-disabled", isDisabled ? "true" : "false");
        el.href = isDisabled ? "javascript:void(0)" : url;
        el.title = isDisabled ? serverGpxState.message : "";
      });
    }

    async function syncGpxFromServer() {
      try {
        const r = await postToScript({ action: "get_gpx" });
        if (r.status === "success" && r.gpx5km && r.gpx50km) {
          serverGpxState = {
            unlocked: true,
            gpx5km: r.gpx5km,
            gpx50km: r.gpx50km,
            message: ""
          };
        } else {
          serverGpxState = {
            unlocked: false,
            gpx5km: "",
            gpx50km: "",
            message: r.message || "Unduhan GPX masih dikunci hingga jadwal pembukaan resmi."
          };
        }
      } catch (_) {
        // Jika offline/gagal konek, pertahankan status terkunci saat ini
      }
      updateGpxButtonState();
    }

    function handleGpxClick(e, categoryLabel) {
      if (!serverGpxState.unlocked) {
        if (e && e.preventDefault) e.preventDefault();
        showStatus(
          `Download GPX ${categoryLabel}: ${serverGpxState.message}`,
          "warn"
        );
        syncGpxFromServer();
        return false;
      }
      return true;
    }


    // Jadwal resmi Hari H (WIB +07:00)
    const EVENT_START_DATE = new Date("2026-11-22T05:00:00+07:00");
    // Ubah ke false saat sudah siap untuk Hari H asli
    const TEST_ALLOW_START_BEFORE_EVENT = true;

    // Cross-check GPS: set true untuk mewajibkan peserta berada dalam radius tiap titik
    const GPS_CHECK_ENABLED = true;

    // Sesuaikan lat, lng, dan maxDistanceMeters (dalam meter) untuk tiap titik
    const CHECKIN_COORDS = {
      start:  { label: "START",  lat: -7.2575, lng: 112.7521, maxDistanceMeters: 500 },
      cp1:    { label: "CP 1",   lat: -7.2575, lng: 112.7521, maxDistanceMeters: 500 },
      cp2:    { label: "CP 2",   lat: -7.2575, lng: 112.7521, maxDistanceMeters: 500 },
      cp3:    { label: "CP 3",   lat: -7.2575, lng: 112.7521, maxDistanceMeters: 500 },
      finish: { label: "FINISH", lat: -7.2575, lng: 112.7521, maxDistanceMeters: 500 }
    };

    const POINT_BUTTON_IDS = ["btnStart", "btnCp1", "btnCp2", "btnCp3", "btnFinish", "btnDnf"];
    const ORIGINAL_BTN_LABELS = {
      btnStart: "START",
      btnCp1: "CP 1",
      btnCp2: "CP 2",
      btnCp3: "CP 3",
      btnFinish: "FINISH",
      btnDnf: "LAPOR DNF"
    };

    let cachedCategoryRegId = "";
    let cachedCategoryText = "";
    let categoryDebounceTimer = null;
    let isCheckinBusy = false;

    // --- LOCALSTORAGE SESSION ---
    function saveSession(regId, bib, bib2, category) {
      try {
        const payload = {
          regId: (regId || "").trim(),
          bib: (bib || "").trim().toUpperCase(),
          bib2: (bib2 || "").trim().toUpperCase(),
          category: (category || "").trim()
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        renderSessionBar(payload);
      } catch (_) {}
    }

    function loadSavedSession() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data || !data.bib) return;

        const regIdEl = document.getElementById("inputRegId");
        const bib1El = document.getElementById("inputBIB");
        const bib2El = document.getElementById("inputBIB2");

        if (regIdEl && data.regId) regIdEl.value = data.regId;
        if (bib1El && data.bib) bib1El.value = data.bib;
        if (bib2El && data.bib2) bib2El.value = data.bib2;

        if (data.category) {
          cachedCategoryRegId = data.regId || "";
          cachedCategoryText = data.category;
          setPairFieldState(data.category);
        }

        renderSessionBar(data);
        updatePointButtonsByCategory();
      } catch (_) {}
    }

    function renderSessionBar(session) {
      const bar = document.getElementById("sessionBar");
      const bibEl = document.getElementById("sessionBibText");
      const catEl = document.getElementById("sessionCatText");
      if (!bar || !bibEl || !catEl) return;

      if (session && session.bib) {
        bibEl.textContent = session.bib;
        catEl.textContent = session.category ? `(${session.category})` : "";
        bar.classList.remove("hidden");
      } else {
        bar.classList.add("hidden");
      }
    }

    function clearSavedSession() {
      if (!confirm("Hapus sesi BIB yang tersimpan di perangkat ini?")) return;
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (_) {}

      cachedCategoryRegId = "";
      cachedCategoryText = "";
      document.getElementById("inputRegId").value = "";
      document.getElementById("inputBIB").value = "";
      document.getElementById("inputBIB2").value = "";
      document.getElementById("inputDob").value = "";
      document.getElementById("groupVerifyDob").classList.add("hidden");
      setPairFieldState("");
      renderSessionBar(null);
      updatePointButtonsByCategory();
      showStatus("Sesi dihapus. Silakan masukkan ID Pendaftar dan BIB baru.", "info");
    }

    // --- KATEGORI & VISIBILITAS TOMBOL ---
    function detectCategoryGroup() {
      const cat = (cachedCategoryText || "").toLowerCase();
      if (cat.includes("500")) return "500KM";
      if (cat.includes("50")) return "50KM";
      if (cat.includes("5km") || cat.includes("parent")) return "5KM";

      // Fallback deteksi dari awalan BIB jika kategori belum terambil dari server
      const bib = (document.getElementById("inputBIB")?.value || "").trim().toUpperCase();
      if (/^A\d+/i.test(bib)) return "5KM";
      if (/^B\d+/i.test(bib)) return "50KM";
      if (/^5\d{2}/.test(bib)) return "500KM";

      return "500KM"; // Default tampilkan semua sebelum terdeteksi
    }

    function updatePointButtonsByCategory() {
      const group = detectCategoryGroup();
      const hide500Only = (group === "5KM" || group === "50KM");

      ["btnCp1", "btnCp2", "btnCp3", "btnDnf"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle("hidden", hide500Only);
      });
    }

    // --- LOADING STATE & ANTI DOUBLE-TAP ---
    function setCheckinLoading(isLoading, activePointKey = "") {
      isCheckinBusy = isLoading;
      const pointToBtnId = {
        start: "btnStart",
        cp1: "btnCp1",
        cp2: "btnCp2",
        cp3: "btnCp3",
        finish: "btnFinish",
        dnf: "btnDnf"
      };

      POINT_BUTTON_IDS.forEach((id) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        if (isLoading) {
          btn.disabled = true;
          btn.classList.add("disabled");
          if (pointToBtnId[activePointKey] === id) {
            btn.textContent = "Memproses...";
          }
        } else {
          btn.textContent = ORIGINAL_BTN_LABELS[id];
          btn.disabled = false;
          btn.classList.remove("disabled");
        }
      });

      if (!isLoading) {
        updateStartButtonState();
      }
    }

    // --- GPX & START LOCK ---
    function isGpxLocked() {
      if (TEST_UNLOCK_GPX_BEFORE_DEADLINE) return false;
      return new Date() < GPX_UNLOCK_DATE;
    }

    function updateGpxButtonState() {
      const locked = isGpxLocked();
      const link5 = document.getElementById("btnGpx5KM");
      const link50 = document.getElementById("btnGpx50KM");
      const titleEl = document.getElementById("gpxTitle");

      if (titleEl) {
        titleEl.textContent = locked
          ? "Unduh Rute GPX (Terkunci s/d 25 Des 2026 20:59 WIB)"
          : "Unduh Rute GPX";
      }

      [
        { el: link5, url: GPX_5KM_URL },
        { el: link50, url: GPX_50KM_URL }
      ].forEach(({ el, url }) => {
        if (!el) return;
        el.classList.toggle("locked", locked);
        el.setAttribute("aria-disabled", locked ? "true" : "false");
        el.href = locked ? "javascript:void(0)" : url;
        el.title = locked ? "Unduhan GPX dibuka mulai 25 Desember 2026 pukul 20:59 WIB." : "";
      });
    }

    function handleGpxClick(e, categoryLabel) {
      if (isGpxLocked()) {
        if (e && e.preventDefault) e.preventDefault();
        showStatus(
          `Download GPX ${categoryLabel} masih dikunci hingga 25 Desember 2026 pukul 20:59 WIB.`,
          "warn"
        );
        updateGpxButtonState();
        return false;
      }
      return true;
    }

    function showStatus(msg, type = "ok") {
      const box = document.getElementById("status");
      if (!box) return;
      box.className = "";
      if (type === "ok") box.classList.add("status-ok");
      else if (type === "warn") box.classList.add("status-warn");
      else if (type === "info") box.classList.add("status-info");
      else box.classList.add("status-err");
      box.textContent = msg;
    }

    function isStartLocked() {
      if (TEST_ALLOW_START_BEFORE_EVENT) return false;
      return new Date() < EVENT_START_DATE;
    }

    function updateStartButtonState() {
      if (isCheckinBusy) return;
      const startBtn = document.getElementById("btnStart");
      if (!startBtn) return;

      const locked = isStartLocked();
      startBtn.disabled = locked;
      startBtn.classList.toggle("disabled", locked);
      startBtn.title = locked ? "Check-in START baru dibuka pada Hari H." : "";
    }

    // --- FORM REGISTRASI & PAIRING ---
    function normalizeDobInput(val) {
      if (!val) return "";
      const s = val.toString().trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m) {
        const dd = m[1].padStart(2, "0");
        const mm = m[2].padStart(2, "0");
        return `${m[3]}-${mm}-${dd}`;
      }
      return s;
    }

    function isTwoBibCategory(categoryText) {
      const c = (categoryText || "").toString().trim().toLowerCase();
      return c.includes("pairing") || c.includes("parent") || c.includes("5km");
    }

    function setPairFieldState(categoryText) {
      const isTwoBib = isTwoBibCategory(categoryText);
      const groupPair = document.getElementById("groupBibPair");
      const bib2Input = document.getElementById("inputBIB2");
      const pairLabel = groupPair ? groupPair.querySelector("label") : null;
      if (!groupPair || !bib2Input) return;

      groupPair.classList.toggle("hidden", !isTwoBib);
      bib2Input.required = false;

      if (pairLabel) {
        const c = (categoryText || "").toString().toLowerCase();
        if (c.includes("5km") || c.includes("parent")) {
          pairLabel.textContent = "Nomor BIB Kedua (Anak / Pasangan 5KM)";
          bib2Input.placeholder = "Masukkan BIB kedua (misal: A02)";
        } else {
          pairLabel.textContent = "Nomor BIB Pasangan / Kedua (Pairing)";
          bib2Input.placeholder = "Masukkan BIB kedua bila kategori pairing";
        }
      }

      if (!isTwoBib) {
        bib2Input.value = "";
      }
    }

    async function checkRegIdType() {
      const regId = (document.getElementById("inputRegId")?.value || "").trim();
      if (!regId) {
        cachedCategoryRegId = "";
        cachedCategoryText = "";
        setPairFieldState("");
        updatePointButtonsByCategory();
        return;
      }

      if (cachedCategoryRegId.toLowerCase() === regId.toLowerCase()) {
        setPairFieldState(cachedCategoryText);
        updatePointButtonsByCategory();
        return;
      }

      if (regId.length < 4) {
        setPairFieldState("");
        return;
      }

      try {
        const r = await postToScript({
          action: "check_category",
          regId: regId
        });

        if (r.status === "success" && r.category) {
          cachedCategoryRegId = regId;
          cachedCategoryText = String(r.category);
          setPairFieldState(cachedCategoryText);
          updatePointButtonsByCategory();
        } else {
          setPairFieldState("");
        }
      } catch (_) {
        setPairFieldState("");
      }
    }

    function onRegIdInput() {
      const groupDob = document.getElementById("groupVerifyDob");
      const inputDob = document.getElementById("inputDob");
      if (groupDob && inputDob) {
        groupDob.classList.add("hidden");
        inputDob.required = false;
        inputDob.value = "";
      }

      clearTimeout(categoryDebounceTimer);
      categoryDebounceTimer = setTimeout(checkRegIdType, 350);
    }

    async function postToScript(payloadObj) {
      const params = new URLSearchParams();
      Object.keys(payloadObj).forEach((k) => {
        params.append(k, payloadObj[k] ?? "");
      });

      const res = await fetch(`${SCRIPT_URL}?${params.toString()}`);
      const rawText = await res.text();

      let data;
      try {
        data = JSON.parse(rawText);
      } catch (err) {
        throw new Error("Respons server bukan format JSON valid.");
      }

      if (!res.ok) {
        throw new Error(data.message || `HTTP Error ${res.status}`);
      }
      return data;
    }

    async function handleRegisterCheckin(e) {
      if (e && e.preventDefault) e.preventDefault();

      const regIdEl = document.getElementById("inputRegId");
      const bib1El = document.getElementById("inputBIB");
      const bib2El = document.getElementById("inputBIB2");
      const groupDob = document.getElementById("groupVerifyDob");
      const dobInput = document.getElementById("inputDob");
      const submitBtn = document.getElementById("btnSubmitReg");

      const regId = (regIdEl?.value || "").trim();
      const bib1 = (bib1El?.value || "").trim().toUpperCase();
      const bib2 = (bib2El?.value || "").trim().toUpperCase();
      const dob = normalizeDobInput(dobInput?.value || "");

      if (!regId || !bib1) {
        showStatus("Lengkapi ID Pendaftar dan Nomor BIB terlebih dahulu.", "err");
        return;
      }

      if (bib2El && !bib2El.closest(".hidden") && bib2) {
        if (bib1 === bib2) {
          showStatus("Nomor BIB pertama dan kedua tidak boleh sama.", "err");
          return;
        }
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Menghubungkan...";
      }
      showStatus("Memverifikasi data ke server...", "info");

      try {
        const r = await postToScript({
          action: "register_checkin",
          regId: regId,
          bib: bib1,
          bib2: bib2,
          dob: dob
        });

        if (r.status === "need_dob") {
          if (groupDob && dobInput) {
            groupDob.classList.remove("hidden");
            dobInput.required = true;
            dobInput.focus();
          }
          showStatus(
            r.message || "ID sudah pernah diklaim. Masukkan Tanggal Lahir untuk memulihkan akses absensi.",
            "warn"
          );
          return;
        }

        if (r.status === "success") {
          if (groupDob && dobInput) {
            groupDob.classList.add("hidden");
            dobInput.required = false;
          }
          const finalBib = r.bib ? String(r.bib).trim().toUpperCase() : bib1;
          if (bib1El) bib1El.value = finalBib;

          const finalCat = r.category || cachedCategoryText || detectCategoryGroup();
          cachedCategoryRegId = regId;
          cachedCategoryText = finalCat;

          saveSession(regId, finalBib, bib2, finalCat);
          updatePointButtonsByCategory();
          showStatus(r.message || "BIB berhasil dihubungkan dan sesi disimpan di perangkat ini.", "ok");
        } else {
          showStatus(r.message || "Gagal memproses klaim BIB.", "err");
        }
      } catch (err) {
        showStatus(err.message || "Koneksi terputus ke server.", "err");
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Hubungkan / Pulihkan BIB";
        }
      }
    }

    // --- GPS & CHECK-IN ---
    function calculateDistanceMeters_(lat1, lng1, lat2, lng2) {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function getCurrentLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ lat: "", lng: "", accuracy: null, error: "Perangkat tidak mendukung GPS / Geolocation." });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: Math.round(pos.coords.accuracy || 0),
            error: ""
          }),
          (err) => resolve({
            lat: "",
            lng: "",
            accuracy: null,
            error: err && err.code === 1
              ? "Izin lokasi GPS ditolak. Aktifkan izin lokasi di browser."
              : "Gagal membaca koordinat GPS. Pastikan GPS aktif."
          }),
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 }
        );
      });
    }

    function crossCheckGps(pointKey, coords) {
      const target = CHECKIN_COORDS[pointKey];
      if (!GPS_CHECK_ENABLED || !target) {
        return { ok: true, distanceMeters: null };
      }

      if (coords.lat === "" || coords.lng === "") {
        return {
          ok: false,
          message: `Cross-check GPS ${target.label} gagal: ${coords.error || "Koordinat GPS tidak tersedia."}`
        };
      }

      const dist = calculateDistanceMeters_(
        Number(coords.lat),
        Number(coords.lng),
        Number(target.lat),
        Number(target.lng)
      );

      if (dist > target.maxDistanceMeters) {
        const accInfo = coords.accuracy ? `\nAkurasi GPS perangkat Anda saat ini: ±${coords.accuracy} m.` : "";
        return {
          ok: false,
          message: `Di luar area ${target.label}! Jarak Anda ${Math.round(dist)} m (batas maksimal ${target.maxDistanceMeters} m).${accInfo}`
        };
      }

      return { ok: true, distanceMeters: Math.round(dist) };
    }

    async function sendToServer(pointKey, bib, lat, lng) {
      const normalizedPoint = (pointKey || "").toString().trim().toLowerCase();
      const cleanBib = (bib || "").toString().trim().toUpperCase();

      if (normalizedPoint === "start" && isStartLocked()) {
        showStatus("Check-in START belum dibuka karena belum memasuki Hari H.", "warn");
        updateStartButtonState();
        return;
      }

      showStatus(`Mengirim laporan ${normalizedPoint.toUpperCase()} untuk BIB ${cleanBib}...`, "info");

      try {
        const r = await postToScript({
          action: "checkin",
          bib: cleanBib,
          point: normalizedPoint,
          lat: lat ?? "",
          lng: lng ?? "",
          allowBeforeEvent: TEST_ALLOW_START_BEFORE_EVENT ? "1" : "0"
        });

        showStatus(
          r.message || (r.status === "success" ? "Check-in berhasil." : "Check-in gagal."),
          r.status === "success" ? "ok" : "err"
        );
      } catch (err) {
        showStatus(err.message || "Koneksi terputus ke server.", "err");
      }
    }

    async function triggerCheckin(pointKey) {
      if (isCheckinBusy) return;

      const normalizedPoint = (pointKey || "").toString().trim().toLowerCase();
      const bib = (document.getElementById("inputBIB")?.value || "").trim().toUpperCase();

      if (!bib) {
        showStatus("Masukkan atau hubungkan Nomor BIB terlebih dahulu.", "err");
        return;
      }

      // Konfirmasi ganda khusus LAPOR DNF
      if (normalizedPoint === "dnf") {
        const firstConfirm = confirm(
          `PERINGATAN: Anda akan melaporkan DNF untuk BIB ${bib}.\nStatus DNF bersifat permanen dan tidak bisa dibatalkan.\n\nLanjutkan?`
        );
        if (!firstConfirm) return;

        const typed = prompt('Ketik kata "DNF" (huruf besar) untuk mengonfirmasi:');
        if (typed === null || typed.trim().toUpperCase() !== "DNF") {
          showStatus("Pelaporan DNF dibatalkan.", "warn");
          return;
        }
      }

      setCheckinLoading(true, normalizedPoint);
      showStatus("Mengambil sinyal GPS, mohon tunggu...", "info");

      try {
        const coords = await getCurrentLocation();

        if (["start", "cp1", "cp2", "cp3", "finish"].includes(normalizedPoint)) {
          const gpsCheck = crossCheckGps(normalizedPoint, coords);
          if (!gpsCheck.ok) {
            showStatus(gpsCheck.message, "err");
            return;
          }
        }

        await sendToServer(normalizedPoint, bib, coords.lat, coords.lng);
      } finally {
        setCheckinLoading(false);
      }
    }

       // --- INIT ---
    loadSavedSession();
    updateGpxButtonState();
    syncGpxFromServer();
    updateStartButtonState();
    updatePointButtonsByCategory();

    setInterval(() => {
      if (!serverGpxState.unlocked) {
        syncGpxFromServer();
      }
      updateStartButtonState();
    }, 60000);
  </script>
