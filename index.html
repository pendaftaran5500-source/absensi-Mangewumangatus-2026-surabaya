<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-in Mangewumangatus 2026 - Surabaya</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }
    .container { max-width: 520px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { margin: 0 0 6px; font-size: 1.25rem; }
    p.sub { margin: 0 0 18px; color: #94a3b8; font-size: .9rem; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: .88rem; color: #e2e8f0; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    input:focus { outline: none; border-color: #38bdf8; }
    .hidden { display: none; }
    button { width: 100%; padding: 11px 14px; border: none; border-radius: 8px; font-weight: 600; font-size: .95rem; cursor: pointer; transition: .15s; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #0369a1; }
    button:disabled, button.disabled { opacity: .45; cursor: not-allowed; }
    .grid-points { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
    .btn-point { background: #334155; color: #f8fafc; }
    .btn-point:hover:not(:disabled) { background: #475569; }
    .btn-start { background: #16a34a; color: #fff; }
    .btn-start:hover:not(:disabled) { background: #15803d; }
    .btn-finish { background: #2563eb; color: #fff; }
    .btn-finish:hover:not(:disabled) { background: #1d4ed8; }
    .btn-dnf { grid-column: span 2; background: #be123c; color: #fff; }
    .btn-dnf:hover:not(:disabled) { background: #9f1239; }
    #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: .9rem; line-height: 1.45; white-space: pre-line; display: none; }
    .status-ok { display: block !important; background: #052e16; border: 1px solid #16a34a; color: #86efac; }
    .status-warn { display: block !important; background: #422006; border: 1px solid #eab308; color: #fde047; }
    .status-err { display: block !important; background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Check-in Mangewumangatus 2026</h1>
    <p class="sub">Klaim BIB, pemulihan sesi, dan pelaporan titik check-in / DNF</p>

    <form id="registerForm" onsubmit="handleRegisterCheckin(event)">
      <div class="form-group">
        <label for="inputRegId">ID Pendaftar</label>
        <input id="inputRegId" type="text" placeholder="Contoh: Mm2026sby-0003" oninput="onRegIdInput()" required />
      </div>

      <div class="form-group">
        <label for="inputBIB">Nomor BIB</label>
        <input id="inputBIB" type="text" placeholder="Contoh: 555 atau B01" required />
      </div>

      <div id="groupBibPair" class="form-group hidden">
        <label for="inputBIB2">Nomor BIB Pasangan / Kedua (Pairing)</label>
        <input id="inputBIB2" type="text" placeholder="Masukkan BIB kedua bila kategori pairing" />
      </div>

      <div id="groupVerifyDob" class="form-group hidden">
        <label for="inputDob">Tanggal Lahir (Verifikasi Pemulihan Sesi)</label>
        <input id="inputDob" type="date" />
      </div>

      <button type="submit" class="btn-primary">Hubungkan / Pulihkan BIB</button>
    </form>

    <div class="grid-points">
      <button id="btnStart" type="button" class="btn-point btn-start" onclick="triggerCheckin('start')">START</button>
      <button id="btnCp1" type="button" class="btn-point" onclick="triggerCheckin('cp1')">CP 1</button>
      <button id="btnCp2" type="button" class="btn-point" onclick="triggerCheckin('cp2')">CP 2</button>
      <button id="btnCp3" type="button" class="btn-point" onclick="triggerCheckin('cp3')">CP 3</button>
      <button id="btnFinish" type="button" class="btn-point btn-finish" onclick="triggerCheckin('finish')">FINISH</button>
      <button id="btnDnf" type="button" class="btn-point btn-dnf" onclick="triggerCheckin('dnf')">LAPOR DNF</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxquVvOjbBq0575d24B0_03lfnSuMllgbJeQblNJFYeaQPF07rUGDI7KLakQD0aRnyB/exec";

    // Jadwal resmi Hari H (WIB +07:00)
    const EVENT_START_DATE = new Date("2026-11-22T05:00:00+07:00");
    // Ubah ke false saat sudah siap untuk Hari H asli
    const TEST_ALLOW_START_BEFORE_EVENT = true;

    function showStatus(msg, type = "ok") {
      const box = document.getElementById("status");
      if (!box) return;
      box.className = "";
      if (type === "ok") box.classList.add("status-ok");
      else if (type === "warn") box.classList.add("status-warn");
      else box.classList.add("status-err");
      box.textContent = msg;
    }

    function isStartLocked() {
      if (TEST_ALLOW_START_BEFORE_EVENT) return false;
      return new Date() < EVENT_START_DATE;
    }

    function updateStartButtonState() {
      const startBtn = document.getElementById("btnStart");
      if (!startBtn) return;

      const locked = isStartLocked();
      startBtn.disabled = locked;
      startBtn.classList.toggle("disabled", locked);
      startBtn.title = locked ? "Check-in START baru dibuka pada Hari H." : "";
    }

    function normalizeDobInput(val) {
      if (!val) return "";
      const s = val.toString().trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m) {
        const dd = m[1].padStart(2, "0");
        const mm = m[2].padStart(2, "0");
        return `${m[3]}-${mm}-${dd}`;
      }
      return s;
    }

    function checkRegIdType() {
      const regId = (document.getElementById("inputRegId")?.value || "").trim();
      const groupPair = document.getElementById("groupBibPair");
      const bib2Input = document.getElementById("inputBIB2");
      if (!groupPair || !bib2Input) return;

      const showPair = regId.length >= 5;
      groupPair.classList.toggle("hidden", !showPair);
      bib2Input.required = showPair;
      if (!showPair) bib2Input.value = "";
    }

    function onRegIdInput() {
      const groupDob = document.getElementById("groupVerifyDob");
      const inputDob = document.getElementById("inputDob");
      if (groupDob && inputDob) {
        groupDob.classList.add("hidden");
        inputDob.required = false;
        inputDob.value = "";
      }
      checkRegIdType();
    }

    async function postToScript(payloadObj) {
      const params = new URLSearchParams();
      Object.keys(payloadObj).forEach((k) => {
        params.append(k, payloadObj[k] ?? "");
      });

      const res = await fetch(`${SCRIPT_URL}?${params.toString()}`);
      const rawText = await res.text();

      let data;
      try {
        data = JSON.parse(rawText);
      } catch (err) {
        throw new Error("Respons server bukan format JSON valid.");
      }

      if (!res.ok) {
        throw new Error(data.message || `HTTP Error ${res.status}`);
      }
      return data;
    }

    async function handleRegisterCheckin(e) {
      if (e && e.preventDefault) e.preventDefault();

      const regIdEl = document.getElementById("inputRegId");
      const bib1El = document.getElementById("inputBIB");
      const bib2El = document.getElementById("inputBIB2");
      const groupDob = document.getElementById("groupVerifyDob");
      const dobInput = document.getElementById("inputDob");
      const submitBtn = e?.target?.querySelector("button[type='submit']") || null;

      const regId = (regIdEl?.value || "").trim();
      const bib1 = (bib1El?.value || "").trim().toUpperCase();
      const bib2 = (bib2El?.value || "").trim().toUpperCase();
      const dob = normalizeDobInput(dobInput?.value || "");

      if (!regId || !bib1) {
        showStatus("Lengkapi ID Pendaftar dan Nomor BIB terlebih dahulu.", "err");
        return;
      }

      if (bib2El && !bib2El.closest(".hidden") && bib2El.required) {
        if (!bib2) {
          showStatus("Lengkapi Nomor BIB kedua bila kategori pairing.", "err");
          return;
        }
        if (bib1 === bib2) {
          showStatus("Nomor BIB pertama dan kedua tidak boleh sama.", "err");
          return;
        }
      }

      if (submitBtn) submitBtn.disabled = true;

      try {
        const r = await postToScript({
          action: "register_checkin",
          regId: regId,
          bib: bib1,
          bib2: bib2,
          dob: dob
        });

        if (r.status === "need_dob") {
          if (groupDob && dobInput) {
            groupDob.classList.remove("hidden");
            dobInput.required = true;
            dobInput.focus();
          }
          showStatus(
            r.message || "ID sudah pernah diklaim. Masukkan Tanggal Lahir untuk memulihkan akses absensi.",
            "warn"
          );
          return;
        }

        if (r.status === "success") {
          if (groupDob && dobInput) {
            groupDob.classList.add("hidden");
            dobInput.required = false;
          }
          if (r.bib && bib1El) {
            bib1El.value = r.bib;
          }
          showStatus(r.message || "BIB berhasil dihubungkan.", "ok");
        } else {
          showStatus(r.message || "Gagal memproses klaim BIB.", "err");
        }
      } catch (err) {
        showStatus(err.message || "Koneksi terputus ke server.", "err");
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    function getCurrentLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ lat: "", lng: "" });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => resolve({ lat: "", lng: "" }),
          { enableHighAccuracy: true, timeout: 6000, maximumAge: 15000 }
        );
      });
    }

    async function sendToServer(pointKey, bib, lat, lng) {
      const normalizedPoint = (pointKey || "").toString().trim().toLowerCase();
      const cleanBib = (bib || "").toString().trim().toUpperCase();

      if (!cleanBib) {
        showStatus("Masukkan Nomor BIB terlebih dahulu.", "err");
        return;
      }

      if (normalizedPoint === "start" && isStartLocked()) {
        showStatus("Check-in START belum dibuka karena belum memasuki Hari H.", "warn");
        updateStartButtonState();
        return;
      }

      try {
        const r = await postToScript({
          action: "checkin",
          bib: cleanBib,
          point: normalizedPoint,
          lat: lat ?? "",
          lng: lng ?? "",
          allowBeforeEvent: TEST_ALLOW_START_BEFORE_EVENT ? "1" : "0"
        });

        showStatus(
          r.message || (r.status === "success" ? "Check-in berhasil." : "Check-in gagal."),
          r.status === "success" ? "ok" : "err"
        );
      } catch (err) {
        showStatus(err.message || "Koneksi terputus ke server.", "err");
      }
    }

    async function triggerCheckin(pointKey) {
      const bib = (document.getElementById("inputBIB")?.value || "").trim().toUpperCase();
      const coords = await getCurrentLocation();
      await sendToServer(pointKey, bib, coords.lat, coords.lng);
    }

    updateStartButtonState();
    setInterval(updateStartButtonState, 30000);
  </script>
</body>
</html>
