<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mangewumangatus 2026 - Portal Peserta</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #1e293b; }
    .card { background: #ffffff; max-width: 480px; margin: 10px auto; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #0f766e; margin-top: 0; font-size: 22px; }
    .subtitle { text-align: center; font-size: 14px; color: #64748b; margin-top: -10px; margin-bottom: 20px; }
    .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; background: #0f766e; text-align: center; box-sizing: border-box; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: #115e59; }
    .btn:disabled { background: #cbd5e1 !important; cursor: not-allowed; color: #64748b; }
    .btn-gpx { background: #2563eb; }
    .btn-gpx:hover { background: #1d4ed8; }
    .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #64748b; font-size: 12px; padding: 8px; margin-top: 20px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; color: #334155; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; }
    input:focus, select:focus { border-color: #0f766e; }
    .status { padding: 12px; border-radius: 8px; display: none; margin-bottom: 15px; text-align: center; font-weight: 600; font-size: 14px; }
    .ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .warn { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
    .err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .hidden { display: none !important; }
    .info-box { background: #f1f5f9; padding: 14px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; border-left: 4px solid #0f766e; }
    .divider { height: 1px; background: #e2e8f0; margin: 20px 0; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="pageTitle">Mangewumangatus 2026</h2>
  <div class="subtitle" id="pageSubtitle">Portal Layanan Peserta</div>
  <div id="status" class="status"></div>

<!-- TAMPILAN 1: FORM KLAIM BIB & RACE PACK -->
  <div id="viewKlaimBIB" class="hidden">
    <div class="info-box">
      <b>Pengambilan Race Pack:</b><br>Masukkan ID Pendaftar Anda dan tentukan Nomor BIB sesuai kategori Anda.
    </div>
    <form id="bibForm" onsubmit="handleRegisterCheckin(event)">
      <div class="form-group">
        <label for="inputRegId">ID Pendaftar (contoh: Mm2026sby-0001)</label>
        <input type="text" id="inputRegId" placeholder="Masukkan ID Pendaftar" required>
      </div>
      <!-- Dropdown Kategori DIHAPUS agar peserta tidak bisa salah pilih / manipulasi -->
      <div class="form-group">
        <label for="inputBIB">Nomor BIB Pilihan</label>
        <input type="text" id="inputBIB" placeholder="Contoh: 501 / B01 / A01" required>
      </div>
      <button type="submit" id="btnSubmitBib" class="btn">Simpan BIB & Lanjut Ke Menu Absensi</button>
    </form>
  </div>

  <!-- TAMPILAN 2: MENU ABSENSI GPS & GPX -->
  <div id="viewAbsensiGPS" class="hidden">
    <div id="infoPeserta" class="info-box">Memuat data peserta...</div>

    <!-- AREA GPX (Tampil jika ada link panitia, disembunyikan/custom jika kategori 500km) -->
    <div id="gpxContainer">
      <a id="btnGpx" href="#" target="_blank" class="btn btn-gpx">🗺️ Download Rute GPX</a>
    </div>
    
    <div class="divider"></div>
    <div style="font-weight: bold; margin-bottom: 10px; font-size: 14px; text-align: center;">Menu Absensi Check-In GPS</div>
    
    <!-- TOMBOL CHECK-IN (START/CP/FINISH) -->
    <div id="buttons"></div>

    <button onclick="resetStoredBib()" class="btn btn-outline">Ganti / Edit Nomor BIB</button>
  </div>
</div>

<script>
// URL WEB APP GOOGLE APPS SCRIPT
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMZGH2FvYJdTHHb3pLTFvXMOFhvNMWecXq5iuZSrpXJLsL7xONzm3KO-5dQu7NtqvCCA/exec";

// TANGGAL RESMI EVENT (Format: YYYY-MM-DD)
const EVENT_DATE = "2026-12-26"; 

// LINK GPX PANITIA (Hanya untuk kategori tertentu, 500km dikosongkan karena rute mandiri)
const GPX_LINKS = {
  '50km':  'https://example.com/rute-50km.gpx',
  '5km':   'https://example.com/rute-5km.gpx'
};

const urlParams = new URLSearchParams(window.location.search);
let currentBib = urlParams.get('bib') || localStorage.getItem('mm_bib') || '';
let currentCategory = urlParams.get('cat') || localStorage.getItem('mm_cat') || '';

const viewKlaimBIB = document.getElementById('viewKlaimBIB');
const viewAbsensiGPS = document.getElementById('viewAbsensiGPS');
const pageSubtitle = document.getElementById('pageSubtitle');

if (!currentBib) {
  showViewKlaimBIB();
} else {
  showViewAbsensiGPS(currentBib, currentCategory);
}

function showViewKlaimBIB() {
  pageSubtitle.textContent = "Pengambilan Race Pack & Klaim BIB";
  viewKlaimBIB.classList.remove('hidden');
  viewAbsensiGPS.classList.add('hidden');
}

function showViewAbsensiGPS(bib, category) {
  pageSubtitle.textContent = "Absensi Check-In & Track GPX";
  viewKlaimBIB.classList.add('hidden');
  viewAbsensiGPS.classList.remove('hidden');

  localStorage.setItem('mm_bib', bib);
  localStorage.setItem('mm_cat', category);

  document.getElementById('infoPeserta').innerHTML = `<b>No. BIB:</b> ${bib} &nbsp;|&nbsp; <b>Kategori:</b> ${category.toUpperCase()}`;
  
  // Atur Tampilan GPX Berdasarkan Kategori
  const gpxContainer = document.getElementById('gpxContainer');
  const catLower = category.toLowerCase();

  if (catLower.includes('500')) {
    // Kategori 500KM rute mandiri (peserta buat sendiri)
    gpxContainer.innerHTML = `<div style="background:#fef9c3; color:#854d0e; padding:12px; border-radius:8px; font-size:13px; text-align:center; border:1px solid #fef08a;"><b>Info GPX:</b> Kategori 500KM menggunakan rute mandiri yang Anda tentukan sendiri.</div>`;
  } else {
    // Kategori lain menggunakan GPX dari panitia
    const gpxUrl = GPX_LINKS[catLower] || '#';
    gpxContainer.innerHTML = `<a id="btnGpx" href="${gpxUrl}" target="_blank" class="btn btn-gpx">🗺️ Download Rute GPX (${category.toUpperCase()})</a>`;
  }

  initCheckInButtons(bib, category);
}

// KLAIM BIB (Mengirim kategori & BIB ke server untuk divalidasi keunikan nomornya per kategori)
async function handleRegisterCheckin(e) {
  e.preventDefault();
  const regId = document.getElementById('inputRegId').value.trim();
  const bib = document.getElementById('inputBIB').value.trim();
  const btn = document.getElementById('btnSubmitBib');

  if (!regId || !bib) return alert("Harap isi semua kolom!");

  btn.disabled = true;
  showStatus("Memverifikasi ID & Nomor BIB...", "warn");

  try {
    // Kirim regId dan bib saja, kategori akan divalidasi mutlak oleh backend
    const targetUrl = `${SCRIPT_URL}?action=register_checkin&regId=${encodeURIComponent(regId)}&bib=${encodeURIComponent(bib)}`;
    let res = await fetch(targetUrl);
    let r = await res.json();

    if (r.status === 'success') {
      showStatus("Berhasil mendaftarkan BIB!", "ok");
      
      // Ambil kategori dari response backend yang valid
      const verifiedCategory = r.category; 

      localStorage.setItem('mm_bib', bib);
      localStorage.setItem('mm_cat', verifiedCategory);

      setTimeout(() => {
        showStatus("", "");
        showViewAbsensiGPS(bib, verifiedCategory);
      }, 1000);
    } else {
      showStatus(`Gagal: ${r.message}`, "err");
      btn.disabled = false;
    }
  } catch (err) {
    showStatus("Kesalahan koneksi jaringan.", "err");
    btn.disabled = false;
  }
}

function initCheckInButtons(bib, category) {
  const CP_COORDINATES = {
    'start':  { lat: -7.2575, lng: 112.7521, radius: 200 },
    'cp1':    { lat: -7.4500, lng: 112.4300, radius: 500 },
    'cp2':    { lat: -7.7800, lng: 112.0100, radius: 500 },
    'cp3':    { lat: -8.1100, lng: 115.1200, radius: 500 },
    'finish': { lat: -7.2575, lng: 112.7521, radius: 300 }
  };

  const now = new Date();
  const today = now.getFullYear() + '-' + 
                String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                String(now.getDate()).padStart(2, '0');

  let points = category.toLowerCase().includes('500') ? [
    { key: 'start', label: '🚩 Check-in START' },
    { key: 'cp1', label: '📍 Check-in CP 1' },
    { key: 'cp2', label: '📍 Check-in CP 2' },
    { key: 'cp3', label: '📍 Check-in CP 3' },
    { key: 'finish', label: '🏁 Check-in FINISH' }
  ] : [
    { key: 'start', label: '🚩 Check-in START' },
    { key: 'finish', label: '🏁 Check-in FINISH' }
  ];

  const buttonsDiv = document.getElementById('buttons');
  buttonsDiv.innerHTML = '';
  
  points.forEach(p => {
    let btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = p.label;
    
    if (p.key === 'start' && today !== EVENT_DATE) {
      btn.disabled = true;
      btn.textContent = `🔒 START (Dibuka ${EVENT_DATE})`;
    } else {
      btn.onclick = () => handleCheckInWithGPS(p.key, bib, CP_COORDINATES);
    }
    
    buttonsDiv.appendChild(btn);
  });
}

async function handleCheckInWithGPS(pointKey, bib, CP_COORDINATES) {
  if (!confirm(`Konfirmasi Check-in ${pointKey.toUpperCase()} untuk BIB ${bib}?`)) return;
  showStatus('Mendeteksi posisi GPS...', 'warn');

  if (!navigator.geolocation) return alert('Browser tidak mendukung GPS.');

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const userLat = position.coords.latitude;
      const userLng = position.coords.longitude;
      const targetCP = CP_COORDINATES[pointKey];
      const distance = calculateDistance(userLat, userLng, targetCP.lat, targetCP.lng);

      if (distance > targetCP.radius) {
        showStatus(`Gagal! Jarak Anda ${Math.round(distance)}m dari titik CP (Max: ${targetCP.radius}m).`, 'err');
        return;
      }
      sendToServer(pointKey, bib, userLat, userLng);
    },
    (error) => {
      showStatus('Gagal mendeteksi GPS. Pastikan izin lokasi aktif.', 'err');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

async function sendToServer(pointKey, bib, lat, lng) {
  const timestamp = new Date().toISOString();
  try {
    const targetUrl = `${SCRIPT_URL}?action=checkin&bib=${encodeURIComponent(bib)}&point=${encodeURIComponent(pointKey)}&timestamp=${encodeURIComponent(timestamp)}&lat=${lat}&lng=${lng}`;
    
    let res = await fetch(targetUrl);
    let r = await res.json();
    showStatus(r.message, r.status === 'success' ? 'ok' : 'err');
  } catch (e) {
    showStatus('Koneksi terputus ke server.', 'err');
  }
}

function resetStoredBib() {
  if (confirm("Apakah Anda ingin mengganti data Nomor BIB pada perangkat ini?")) {
    localStorage.removeItem('mm_bib');
    localStorage.removeItem('mm_cat');
    window.location.href = window.location.pathname;
  }
}

function showStatus(msg, type) {
  let st = document.getElementById('status');
  if (!msg) { st.style.display = 'none'; return; }
  st.textContent = msg;
  st.className = 'status ' + type;
  st.style.display = 'block';
}
</script>

</body>
</html>
