<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; padding: 20px; font-family: sans-serif; }
    .card { max-width: 480px; margin: auto; padding: 24px; border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .btn-primary { background-color: #0d6efd; border: none; font-weight: 600; padding: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card bg-white">
      <h4 class="text-center fw-bold mb-1">Race Pack Check-in</h4>
      <p class="text-muted text-center small mb-4">Mangewumangatus 2026 - Pengambilan H-1</p>
      
      <div id="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 small text-muted">Mengambil data peserta terverifikasi...</p>
      </div>

      <form id="formRp" style="display: none;" onsubmit="handleFormSubmit(event)">
        <div class="mb-3">
          <label class="form-label fw-bold">Pilih Peserta:</label>
          <select id="participantSelect" class="form-select" required onchange="fillParticipantDetails()">
            <option value="">-- Cari Nama / Email --</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small">Kategori:</label>
          <input type="text" id="kategori" class="form-control bg-light" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Nomor BIB:</label>
          <input type="text" id="bib" class="form-control" placeholder="Contoh: 501" required>
        </div>

        <div class="mb-3" id="gpsSection" style="display: none;">
          <label class="form-label fw-bold text-danger">ID GPS Tracker (Khusus 500km):</label>
          <input type="text" id="gpsId" class="form-control" placeholder="Contoh: TRK-500-01">
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-primary w-100 mt-2">Konfirmasi & Simpan</button>
      </form>
      
      <div id="alertMessage" class="mt-3"></div>
    </div>
  </div>

  <script>
    let participantsData = [];

    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(data) {
          participantsData = data;
          let select = document.getElementById('participantSelect');
          data.forEach(function(p, index) {
            let opt = document.createElement('option');
            opt.value = index;
            opt.text = p.nama + " (" + p.kategori + ") - " + p.email;
            select.appendChild(opt);
          });
          document.getElementById('loading').style.display = 'none';
          document.getElementById('formRp').style.display = 'block';
        })
        .getParticipantList();
    };

    function fillParticipantDetails() {
      let idx = document.getElementById('participantSelect').value;
      if (idx === "") return;
      let p = participantsData[idx];
      
      document.getElementById('kategori').value = p.kategori;
      document.getElementById('bib').value = '';
      
      if (p.kategori.toLowerCase().indexOf('500') !== -1) {
        document.getElementById('gpsSection').style.display = 'block';
        document.getElementById('gpsId').required = true;
      } else {
        document.getElementById('gpsSection').style.display = 'none';
        document.getElementById('gpsId').required = false;
        document.getElementById('gpsId').value = '';
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      let idx = document.getElementById('participantSelect').value;
      let p = participantsData[idx];
      
      let formData = {
        nama: p.nama,
        email: p.email,
        kategori: p.kategori,
        bib: document.getElementById('bib').value,
        gpsId: document.getElementById('gpsId').value
      };

      let btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Menyimpan...";

      google.script.run
        .withSuccessHandler(function(res) {
          let alertDiv = document.getElementById('alertMessage');
          if(res.success) {
            alertDiv.innerHTML = `<div class="alert alert-success">${res.message}</div>`;
            document.getElementById('formRp').reset();
            document.getElementById('gpsSection').style.display = 'none';
          } else {
            alertDiv.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
          }
          btn.disabled = false;
          btn.innerText = "Konfirmasi & Simpan";
        })
        .submitRacePack(formData);
    }
  </script>
</body>
</html>
